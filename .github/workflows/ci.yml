name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-24.04
    env:
      LOTTOLAB_B649_PAIR_RULE_FORWARD_SHADOW_READINESS_ROOT: ${{ github.workspace }}/tests/fixtures/b649_pair_rule_forward_shadow_readiness
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record source and test checkout identity
        env:
          PR_SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          source_head="${PR_SOURCE_HEAD:-$EVENT_SHA}"
          actual_checkout_head="$(git rev-parse HEAD)"
          actual_checkout_tree="$(git rev-parse 'HEAD^{tree}')"

          printf 'CI_SOURCE_HEAD=%s\n' "$source_head"
          printf 'CI_EVENT_SHA=%s\n' "$EVENT_SHA"
          printf 'CI_ACTUAL_CHECKOUT_HEAD=%s\n' "$actual_checkout_head"
          printf 'CI_ACTUAL_CHECKOUT_TREE=%s\n' "$actual_checkout_tree"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            printf 'CI_TEST_CHECKOUT_ROLE=PR_MERGE_INTEGRATION\n'
          else
            printf 'CI_TEST_CHECKOUT_ROLE=PUSH_COMMIT\n'
          fi

          if [[ "$actual_checkout_head" != "$EVENT_SHA" ]]; then
            echo "::error::actions/checkout HEAD does not match the GitHub event SHA"
            exit 1
          fi
      - name: Select GNU coreutils timeout
        run: |
          set -euo pipefail
          gnu_bin=""
          for candidate in \
            /usr/bin/timeout \
            /bin/timeout \
            /usr/local/bin/timeout \
            /usr/bin/gtimeout \
            /usr/local/bin/gtimeout \
            /home/linuxbrew/.linuxbrew/bin/timeout \
            /home/linuxbrew/.linuxbrew/bin/gtimeout; do
            if [[ -x "$candidate" ]]; then
              version_output="$("$candidate" --version 2>&1 | head -n 1 || true)"
              if [[ "$version_output" == *"GNU coreutils"* ]]; then
                gnu_bin="$candidate"
                echo "Found GNU coreutils timeout at $gnu_bin: $version_output"
                break
              fi
            fi
          done

          if [[ -z "$gnu_bin" ]]; then
            echo "::error::No genuine GNU coreutils timeout binary found on runner"
            exit 1
          fi

          tool_dir="${RUNNER_TEMP:-/tmp}/gnu-tools"
          mkdir -p "$tool_dir"
          ln -sf "$gnu_bin" "$tool_dir/timeout"
          echo "$tool_dir" >> "$GITHUB_PATH"
          echo "Configured controlled GNU timeout in $tool_dir and added to GITHUB_PATH"
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.13.8
      - run: uv sync --frozen --extra research --python 3.13.8
      - name: Verify GNU timeout wrapper in uv Python environment
        run: |
          uv run python - <<'PYEOF'
          import os
          import shutil
          import subprocess
          import sys

          timeout_path = shutil.which("timeout")
          print(f"DEBUG: shutil.which('timeout') = {timeout_path}")
          if not timeout_path:
              print("::error::timeout binary not found in PATH within uv Python environment", file=sys.stderr)
              sys.exit(1)

          version_res = subprocess.run([timeout_path, "--version"], capture_output=True, text=True, check=False)
          if version_res.returncode != 0:
              print(f"::error::timeout --version probe failed with returncode {version_res.returncode}", file=sys.stderr)
              sys.exit(1)

          version_line = version_res.stdout.splitlines()[0] if version_res.stdout.splitlines() else ""
          print(f"DEBUG: timeout version line = {version_line}")
          if "GNU coreutils" not in version_line:
              print(f"::error::unexpected external timeout wrapper: {version_line}", file=sys.stderr)
              sys.exit(1)

          probe = subprocess.run(
              [timeout_path, "--signal=TERM", "--kill-after=1s", "0.1s", "/bin/sleep", "2"],
              capture_output=True,
              text=True,
              check=False,
          )
          print(f"DEBUG: timeout functional probe returncode = {probe.returncode}")
          if probe.returncode != 124:
              print(f"::error::timeout functional probe expected returncode 124, got {probe.returncode}", file=sys.stderr)
              sys.exit(1)

          print(f"VERIFIED: GNU coreutils timeout is active at {timeout_path} ({version_line})")
          PYEOF
      - run: uv run ruff check .
      - run: uv run pyright
      - name: Verify approved PR #364 provenance sources
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          github.event_name == 'pull_request'
        run: uv run python tools/verify_b649_pr364_provenance.py
      - name: Materialize historical Git provenance in test checkout
        run: |
          set -euo pipefail
          invalid=0
          remote_url="$(git remote get-url origin)"
          checkout_head="$(git rev-parse HEAD)"
          checkout_tree="$(git rev-parse 'HEAD^{tree}')"
          probe_root="$(mktemp -d)"
          trap 'rm -rf "$probe_root"' EXIT
          # A fresh object database per pin proves origin can still provide the source.
          # Fetch by SHA; the approved-tag and restricted-tag policy above stays intact.
          while read -r sha expected_tree; do
            probe_repo="$probe_root/$sha.git"
            git init --quiet --bare "$probe_repo"
            if ! env -u GIT_OBJECT_DIRECTORY -u GIT_ALTERNATE_OBJECT_DIRECTORIES -u GIT_COMMON_DIR \
              git --git-dir="$probe_repo" fetch --no-tags "$remote_url" "$sha"; then
              echo "::error::MISSING_PROVENANCE: origin cannot provide pinned commit $sha (expected tree $expected_tree)"
              invalid=1
              continue
            fi
            actual_commit="$(env -u GIT_OBJECT_DIRECTORY -u GIT_ALTERNATE_OBJECT_DIRECTORIES -u GIT_COMMON_DIR \
              git --git-dir="$probe_repo" rev-parse --verify 'FETCH_HEAD^{commit}')"
            actual_tree="$(env -u GIT_OBJECT_DIRECTORY -u GIT_ALTERNATE_OBJECT_DIRECTORIES -u GIT_COMMON_DIR \
              git --git-dir="$probe_repo" rev-parse --verify 'FETCH_HEAD^{tree}')"
            if [[ "$actual_commit" != "$sha" || "$actual_tree" != "$expected_tree" ]]; then
              echo "::error::PROVENANCE_IDENTITY_MISMATCH: expected $sha (tree $expected_tree), got $actual_commit (tree $actual_tree)"
              invalid=1
              continue
            fi
            # Copy verified commits and their trees/blobs into pytest's actual repository.
            # Checkout-local refs retain the objects after the probe directory is removed.
            probe_ref="refs/ci/verified-provenance/$sha"
            env -u GIT_OBJECT_DIRECTORY -u GIT_ALTERNATE_OBJECT_DIRECTORIES -u GIT_COMMON_DIR \
              git --git-dir="$probe_repo" update-ref "$probe_ref" "$sha"
            checkout_ref="refs/ci/historical-provenance/$sha"
            git fetch --no-tags "$probe_repo" "$probe_ref:$checkout_ref"
            actual_commit="$(git rev-parse --verify "${checkout_ref}^{commit}")"
            actual_tree="$(git rev-parse --verify "${sha}^{tree}")"
            if [[ "$actual_commit" != "$sha" || "$actual_tree" != "$expected_tree" ]]; then
              echo "::error::CHECKOUT_PROVENANCE_IDENTITY_MISMATCH: expected $sha (tree $expected_tree), got $actual_commit (tree $actual_tree)"
              invalid=1
              continue
            fi
            printf 'CI_CHECKOUT_PROVENANCE=%s tree=%s ref=%s\n' "$sha" "$actual_tree" "$checkout_ref"
          done <<'EOF'
          2f70925698cb28758fdf29a62bc5e91028c03a81 216bd91dee0afa58f8186a38aec52b1d47781ef8
          cc493492701d19ad433bba967f14c2f27f844c3e 82e3f6ca1660282906a55a9f32302c826bb97fe1
          038eb9f040a34d2e6a8220caf28f164f94bf1edc 8c1f35844d727ffe0df8fe4c5ebc220cf327e8b7
          5cb67b536c225e53cbf29d3fe5334cfa82a1c652 38b5ad8cace1f0d28323f0dcea3b866dda71286d
          e44a635f1932166734aaa3f64f9469c0e63c7520 8d1b5d168157e8cea47ac44f9ca7537ace053c31
          827a29132ba77bc01bc18307ba822ed75a29751a 1b5c577e34ef31f73a071e466ccc56968ea64585
          4e2fa8a560d6538c2b05b499f99d639e356c6cfa a452a2a868abce481d3ea02fcfa47ba865981a65
          22747b6ebab1c1ded8773d39edf9e5a44eb70769 af0c469501fce7b6002b92065ad2c236845edab1
          7683a4853929b32506a1343f8659427abb4f1ecc 39b1de3977495fdfee7cd64eb8cdeb0f1a2123e0
          9c9d309f89b6050e7b4cb49155fc72ff168f7ef8 3972a602f45062c36d0bac8716a739ca47e95478
          eb2e23902c72720722cd7f12343b5f2b476dd6cc ffac7fbe81470cd0a85ffa01d052ca7779278953
          f2ad83b4e07571a6842ac301d336360cec805a6a 0b089eb90884f14283679528be40295098a5d3ef
          2e27a2c77934c7352b792ab867eb5be20b095372 2d3bf1e263ee13e9c55d49a70a05128a5362dbd3
          4093f95f4f27ea23a5dd4d74cd7c99ff1b97b92b 24280b140a7445744fb11497605c2e184555e79c
          42b8b74f3d4110a8ab4e51544f7756e0701c5e95 4f61bfa8ce7f4afdd2800e654ed7fae89599228c
          8fac3d41b2d519d92b06d6ceb933fe31072c6409 62f80eecf3f1045c905d345a3e68fb2ad078eaec
          a441c6ab8000496f4d28d3bd656c41678976e913 d0a67f2734288603afe8b55699493d1fb0e21ad0
          e3a9843db4339167bffcdc92fb782ff6bb663ed8 f63545acbc883f13ec9c50eea0b3a7e6a2190d3b
          EOF
          if [[ "$invalid" -ne 0 ]]; then
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$checkout_head" || "$(git rev-parse 'HEAD^{tree}')" != "$checkout_tree" ]]; then
            echo "::error::CHECKOUT_IDENTITY_CHANGED: provenance materialization changed the test checkout"
            exit 1
          fi
      - name: Run solver-free certificates and remaining tests in separate processes
        run: |
          set -euo pipefail
          # Immutable certificates inspect the loaded research-source closure and
          # reject solver imports. Give each its own process; run all other tests too.
          remaining_args=()
          for path in \
            tests/unit/test_b649_three_max_profiles_shared_certificate_r2.py \
            tests/unit/test_b649_min_s2_owner_a_exact_bound_r1.py \
            tests/unit/test_b649_min_s2_owner_b_exact_bound_r1.py \
            tests/unit/test_b649_min_s2_post_t256_next_owner_cap248_cert_r1.py \
            tests/unit/test_b649_min_s2_t249_bonf5_single_row_composition_r1.py \
            tests/unit/test_b649_min_s2_t249_dual_profile_composition_r1.py \
            tests/unit/test_b649_min_s2_three_tied_owner_combined_authority_r1.py \
            tests/unit/test_b649_min_s2_two_bonf5_owners_exact_composition_r1.py \
            tests/unit/test_b649_min_s2_two_tied_owner_exact_cert_r1.py \
            tests/unit/test_b649_min_s2_bonferroni5_target_cert_r1.py \
            tests/unit/test_b649_min_s2_bonf5_tied_owners_cert_r1.py; do
            if [[ -f "$path" ]]; then
              uv run pytest "$path"
              remaining_args+=("--ignore=$path")
            fi
          done
          uv run pytest "${remaining_args[@]}"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Record source and test checkout identity
        env:
          PR_SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          source_head="${PR_SOURCE_HEAD:-$EVENT_SHA}"
          actual_checkout_head="$(git rev-parse HEAD)"
          actual_checkout_tree="$(git rev-parse 'HEAD^{tree}')"

          printf 'CI_SOURCE_HEAD=%s\n' "$source_head"
          printf 'CI_EVENT_SHA=%s\n' "$EVENT_SHA"
          printf 'CI_ACTUAL_CHECKOUT_HEAD=%s\n' "$actual_checkout_head"
          printf 'CI_ACTUAL_CHECKOUT_TREE=%s\n' "$actual_checkout_tree"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            printf 'CI_TEST_CHECKOUT_ROLE=PR_MERGE_INTEGRATION\n'
          else
            printf 'CI_TEST_CHECKOUT_ROLE=PUSH_COMMIT\n'
          fi

          if [[ "$actual_checkout_head" != "$EVENT_SHA" ]]; then
            echo "::error::actions/checkout HEAD does not match the GitHub event SHA"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run api:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
