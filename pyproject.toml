[project]
name = "lottolab"
version = "0.1.0"
description = "LottoLab 樂透統計分析系統 — next-generation rebuild of LotteryNew"
readme = "README.md"
authors = [
    { name = "kelvin", email = "kelvin@webcomm.com.tw" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.139.0",
    "pydantic>=2.13.4",
    "typer>=0.26.8",
    "uvicorn[standard]>=0.51.0",
]

[project.optional-dependencies]
research = [
    "ortools>=9.15,<9.16",
]

[project.scripts]
lottolab = "lottolab.interfaces.cli.main:main"

[build-system]
requires = ["uv_build>=0.9.6,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.15.21",
]

[tool.ruff]
line-length = 100
src = ["src", "tests", "tools"]
# Frozen Shell-1 R3-R7 / Bonferroni proof sources: immutable scientific artifacts, exact paths only.
extend-exclude = [
    ".task-data",
    "src/lottolab/research/b649_k20_shell1_bonferroni_portable_r1.py",
    "src/lottolab/research/b649_k20_v8_shell1_r7/common_neighbour_capacity_r7.py",
    "src/lottolab/research/b649_k20_v8_shell1_r7/constants.py",
    "src/lottolab/research/b649_k20_v8_shell1_r7/joint_kn1_bound_r6.py",
    "src/lottolab/research/b649_k20_v8_shell1_r7/k_bound_certify_r3.py",
    "src/lottolab/research/b649_k20_v8_shell1_r7/k_quad_exact_bound_r4.py",
    "src/lottolab/research/b649_k20_v8_shell1_r7/n1_lower_bound_r5.py",
    "src/lottolab/research/b649_k20_v8_shell1_r7/profiles.py",
    "src/lottolab/research/b649_k20_v8_shell1_r7/profiles_k.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests", "tools"]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
# Same frozen proof sources as [tool.ruff] extend-exclude: diagnostics suppressed, files still resolved.
ignore = [
    "src/lottolab/research/b649_k20_shell1_bonferroni_portable_r1.py",
    "src/lottolab/research/b649_k20_v8_shell1_r7/common_neighbour_capacity_r7.py",
    "src/lottolab/research/b649_k20_v8_shell1_r7/constants.py",
    "src/lottolab/research/b649_k20_v8_shell1_r7/joint_kn1_bound_r6.py",
    "src/lottolab/research/b649_k20_v8_shell1_r7/k_bound_certify_r3.py",
    "src/lottolab/research/b649_k20_v8_shell1_r7/k_quad_exact_bound_r4.py",
    "src/lottolab/research/b649_k20_v8_shell1_r7/n1_lower_bound_r5.py",
    "src/lottolab/research/b649_k20_v8_shell1_r7/profiles.py",
    "src/lottolab/research/b649_k20_v8_shell1_r7/profiles_k.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
